# 可复现部署（设计文档 §4.4 / 路线图 Phase 5）
# 本地起全套依赖：docker compose up -d postgres redis milvus neo4j
# 完整平台：    docker compose up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-embedding_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/ragplatform}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      PG_HOST: postgres
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      MILVUS_URI: http://milvus:19530
      API_KEY_PEPPER: ${API_KEY_PEPPER:-replace-with-a-random-secret}
      LEGACY_API_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started

  worker:
    build: .
    command: python scripts/worker.py
    environment:
      PG_HOST: postgres
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  etcd_data:
  minio_data:
  neo4j_data:
